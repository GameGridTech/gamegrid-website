<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Founders - GameGrid</title>
    <meta name="description" content="Meet the founders behind GameGrid's mission to revolutionize grassroots sports">
    <script>
        // Redirect to root but preserve the /founders path for SPA routing
        // Handle both /founders and /founders/ (GitHub Pages adds trailing slash)
        const path = window.location.pathname;
        if (path === '/founders' || path === '/founders/') {
            window.location.href = '/?redirect=founders';
        } else {
            window.location.replace('/');
        }
    </script>
</head>
<body>
    <p>Redirecting to GameGrid...</p>
</body>
</html>
