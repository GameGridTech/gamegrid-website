<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing - GameGrid</title>
    <meta name="description" content="GameGrid pricing plans for sports leagues and tournaments">
    <script>
        // Redirect to root but preserve the /pricing path for SPA routing
        // Use history.replaceState to keep the URL intact
        if (window.location.pathname === '/pricing') {
            window.location.href = '/?redirect=pricing';
        } else {
            window.location.replace('/');
        }
    </script>
</head>
<body>
    <p>Redirecting to GameGrid...</p>
</body>
</html>
